(function(){
  const R=[170,1920,530,2510];
  const box=document.createElement('div');box.className='layer on';box.style.zIndex=2;box.style.overflow='visible';place(box,...R);
  const fondo=document.createElement('img');fondo.src='img/fondo_personaje.jpg';fondo.alt='';box.appendChild(fondo);
  const pj=document.createElement('img');pj.src='img/personaje.png';pj.alt='';pj.style.willChange='transform';pj.style.transformOrigin='50% 100%';box.appendChild(pj);
  main.appendChild(box);
  const START=-560, DUR=6500; let started=false;
  function done(){box.remove()}
  pj.style.transform=`translateX(${START*U}px)`;
  function run(){
    if(started)return;started=true;const t0=performance.now();
    function f(t){const k=Math.min(1,(t-t0)/DUR);const e=1-Math.pow(1-k,1.6);const fade=1-Math.pow(k,3);
      const x=START*(1-e), y=-Math.abs(Math.sin(k*Math.PI*9))*6*fade, r=Math.sin(k*Math.PI*18)*1.4*fade;
      pj.style.transform=`translate(${x*U}px,${y*U}px) rotate(${r}deg)`;
      if(k<1)requestAnimationFrame(f);else done();}
    requestAnimationFrame(f);
  }
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}
  let ready=0;[fondo,pj].forEach(i=>i.decode?i.decode().then(()=>ready++).catch(()=>ready++):ready++);
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){io.disconnect();const go=()=>ready>=2?run():setTimeout(go,50);go()}})},{threshold:.3});
  io.observe(box);
  window.addEventListener('resize',()=>{if(!started)pj.style.transform=`translateX(${START*U}px)`});
})();

  const tapa=document.createElement('div');tapa.className='patch';tapa.style.background='#fff';tapa.style.zIndex=3;place(tapa,898,762,1056,832);main.appendChild(tapa);
  const S=96/1000, BASE=826.6, X0=900.8;
  let x=0, paths='';
  String(n).split('').forEach(ch=>{const g=DIG[ch];paths+=`<path transform="translate(${x},0)" d="${g.d}" ${g.s?`stroke="rgb(63,85,174)" stroke-width="${g.s}" stroke-linejoin="round"`:''}/>`;x+=g.w;});
  const box=document.createElement('div');box.style.position='absolute';box.style.zIndex=4;box.style.pointerEvents='none';
  const H=640;place(box,X0,BASE-620*S,X0+x*S,BASE+20*S);
  box.innerHTML=`<svg viewBox="0 -620 ${x} ${H}" width="100%" height="100%" preserveAspectRatio="none" style="display:block;overflow:visible"><g transform="scale(1,-1)" fill="rgb(63,85,174)">${paths}</g></svg>`;
  box.setAttribute('aria-label',n+' días para la primera jornada');main.appendChild(box);
})();

window.addEventListener('resize',layout);
layout();
const h=location.hash.match(/dia-(\d)/); if(h) openDay(+h[1]);
